<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 摄影店线索管理</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f5;
      --surface: #ffffff;
      --text: #1f2933;
      --muted: #6b7785;
      --line: #e4e9ef;
      --brand: #2f80ed;
      --brand-dark: #1d63c7;
      --danger: #c0392b;
      --shadow: 0 24px 60px rgba(31, 41, 51, 0.16);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .login-page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(420px, 1.08fr) minmax(360px, 0.92fr);
      background:
        linear-gradient(90deg, rgba(10, 18, 28, 0.12), rgba(238, 242, 245, 0.94) 56%),
        url("https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1800&q=82") center left / cover no-repeat;
    }
    .brand-panel {
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 48px;
      color: white;
      overflow: hidden;
    }
    .brand-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(12, 20, 30, 0.08), rgba(12, 20, 30, 0.76));
    }
    .brand-copy {
      position: relative;
      z-index: 1;
      max-width: 520px;
    }
    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      font-weight: 700;
    }
    .brand-mark span {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
    }
    h1, p { margin: 0; }
    h1 {
      max-width: 480px;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1.04;
      letter-spacing: 0;
    }
    .brand-copy p {
      margin-top: 18px;
      max-width: 460px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 15px;
    }
    .login-panel {
      display: grid;
      place-items: center;
      padding: 32px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(246, 248, 250, 0.94));
    }
    .login-card {
      width: min(100%, 430px);
      padding: 34px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(228, 233, 239, 0.9);
      border-radius: 14px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }
    .login-header { margin-bottom: 26px; }
    .login-header h2 {
      margin: 0;
      font-size: 26px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .login-header p {
      margin-top: 8px;
      color: var(--muted);
    }
    .login-form {
      display: grid;
      gap: 14px;
    }
    label {
      display: grid;
      gap: 7px;
      color: #3c4653;
      font-weight: 650;
    }
    input, button {
      width: 100%;
      min-height: 44px;
      border-radius: 8px;
      font: inherit;
    }
    input {
      border: 1px solid var(--line);
      padding: 0 13px;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    input:focus {
      border-color: rgba(47, 128, 237, 0.72);
      box-shadow: 0 0 0 4px rgba(47, 128, 237, 0.12);
    }
    button {
      margin-top: 6px;
      border: 1px solid var(--brand);
      background: var(--brand);
      color: white;
      font-weight: 750;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }
    button:hover {
      background: var(--brand-dark);
      box-shadow: 0 10px 24px rgba(47, 128, 237, 0.22);
      transform: translateY(-1px);
    }
    button:disabled {
      cursor: wait;
      opacity: 0.68;
      transform: none;
      box-shadow: none;
    }
    .status {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
    }
    .status.error { color: var(--danger); }
    .meta {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
    @media (max-width: 820px) {
      .login-page {
        grid-template-columns: 1fr;
        background:
          linear-gradient(180deg, rgba(8, 16, 26, 0.2), rgba(238, 242, 245, 0.96) 45%),
          url("https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=82") center top / cover no-repeat;
      }
      .brand-panel {
        min-height: 280px;
        padding: 28px 24px;
      }
      .brand-copy p { max-width: 360px; }
      .login-panel {
        place-items: start center;
        padding: 22px;
      }
      .login-card {
        margin-top: -48px;
        padding: 26px;
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="login-page">
    <section class="brand-panel" aria-label="摄影店线索管理">
      <div class="brand-copy">
        <div class="brand-mark"><span>影</span>摄影店线索管理</div>
        <h1>把咨询、预约和跟进放进同一个工作台。</h1>
        <p>登录后查看客户聊天记录、预约意向、套餐知识库和运营统计，让门店每天的线索跟进更清楚。</p>
      </div>
    </section>

    <section class="login-panel">
      <form class="login-card" id="loginForm">
        <div class="login-header">
          <h2>登录后台</h2>
          <p>请输入门店管理员账号。</p>
        </div>
        <div class="login-form">
          <label>
            邮箱
            <input id="adminEmail" type="email" placeholder="owner@example.com" autocomplete="username" required>
          </label>
          <label>
            密码
            <input id="adminPassword" type="password" placeholder="请输入密码" autocomplete="current-password" required>
          </label>
          <button id="loginButton" type="submit">进入管理后台</button>
          <div class="status" id="loginStatus">登录成功后将自动进入主界面。</div>
        </div>
        <div class="meta">账号由服务端 admin_users 集合控制；请勿在小程序端保存后台密钥。</div>
      </form>
    </section>
  </main>

  <script>
    const API_BASE_URL = "https://photo-studio-prod-d2drpjd43ee075-1384636564.ap-shanghai.app.tcloudbase.com";
    const SESSION_KEY = "photoStudioAdminSession";

    const $ = (selector) => document.querySelector(selector);
    const storedSession = readStoredSession();

    if (storedSession && storedSession.token) {
      window.location.replace("index.html");
    }

    function readStoredSession() {
      try {
        const stored = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null");
        return stored && stored.token ? stored : null;
      } catch {
        return null;
      }
    }

    function setStatus(message, isError) {
      const status = $("#loginStatus");
      status.textContent = message;
      status.classList.toggle("error", Boolean(isError));
    }

    $("#loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = $("#loginButton");
      button.disabled = true;
      setStatus("正在验证账号...", false);

      try {
        const response = await fetch(`${API_BASE_URL}/api/photo-studio/admin/auth/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: $("#adminEmail").value.trim(),
            password: $("#adminPassword").value
          })
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.error || `登录失败：${response.status}`);
        }

        sessionStorage.setItem(SESSION_KEY, JSON.stringify({
          token: data.token,
          user: data.user,
          expiresAt: Date.now() + Number(data.expiresIn || 0) * 1000
        }));
        setStatus("登录成功，正在进入主界面...", false);
        window.location.replace("index.html");
      } catch (error) {
        setStatus(
          error instanceof TypeError
            ? "浏览器无法访问接口，请检查 CloudBase 跨域设置。"
            : error.message,
          true
        );
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
