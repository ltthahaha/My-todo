<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <script src="https://assets.lemonsqueezy.com/lemon.js" defer></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f7;
      --surface: #ffffff;
      --text: #1f2328;
      --muted: #70757d;
      --line: #e7ebef;
      --accent: #6aa9ff;
      --accent-hover: #4f94ed;
      --accent-soft: #eaf3ff;
      --danger: #e05252;
      --danger-hover: #c93f3f;
      --shadow: 0 18px 48px rgba(31, 35, 40, 0.08);
      --item-shadow: 0 8px 24px rgba(31, 35, 40, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      display: grid;
      place-items: start center;
      padding: 64px 20px;
    }

    main {
      width: min(100%, 560px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 30px;
    }

    header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .title-area {
      display: grid;
      gap: 6px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .count {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .language-switch {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .language-option {
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #eef2f6;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      outline: none;
      display: grid;
      place-items: center;
    }

    .language-option:hover {
      color: var(--accent-hover);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }

    .language-option.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 8px 18px rgba(106, 169, 255, 0.28);
    }

    .language-option:focus-visible {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(106, 169, 255, 0.14);
    }

    form {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      margin-bottom: 24px;
      padding: 6px;
      background: #f9fbfc;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    input,
    button {
      font: inherit;
    }

    input[type="text"],
    input[type="date"] {
      width: 100%;
      min-width: 0;
      border: 0;
      border-radius: 10px;
      padding: 12px 14px;
      outline: none;
      background: transparent;
      color: var(--text);
    }

    input[type="text"]:focus {
      background: #fff;
      box-shadow: 0 0 0 3px rgba(106, 169, 255, 0.16);
    }

    button {
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .add-button {
      background: var(--accent);
      color: #fff;
      padding: 0 20px;
      min-height: 46px;
      white-space: nowrap;
      font-weight: 600;
    }

    .add-button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .add-button:disabled {
      background: #c7cfd8;
      color: #f8fafc;
      cursor: not-allowed;
      transform: none;
    }

    .due-date-input {
      color: var(--muted);
      background: #fff;
      min-height: 46px;
    }

    .upgrade-section,
    .focus-section {
      margin-bottom: 18px;
      padding: 14px;
      background: #f7fbff;
      border: 1px solid #dcecff;
      border-radius: 14px;
    }

    .upgrade-section.unlocked {
      background: #f6fffb;
      border-color: #cdeee0;
    }

    .upgrade-title,
    .focus-title {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 750;
    }

    .upgrade-copy {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .upgrade-benefits {
      display: grid;
      gap: 5px;
      margin: 0 0 12px;
      padding: 0;
      color: #3f5368;
      font-size: 13px;
      list-style: none;
    }

    .upgrade-button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    .upgrade-button:hover {
      background: var(--accent-hover);
      box-shadow: 0 10px 22px rgba(106, 169, 255, 0.24);
      transform: translateY(-1px);
    }

    .pro-status {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      background: #e8f8f0;
      color: #24724d;
      font-size: 13px;
      font-weight: 750;
    }

    .focus-list {
      display: grid;
      gap: 8px;
    }

    .focus-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 13px;
    }

    .focus-empty {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .license-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      margin: 12px 0 0;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
    }

    .license-input {
      min-height: 42px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .license-button {
      min-height: 42px;
      padding: 0 14px;
      background: var(--text);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .license-button:hover {
      background: #343941;
      transform: translateY(-1px);
    }

    .license-status {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .license-status.error {
      color: var(--danger-hover);
    }

    .license-status.success {
      color: #24724d;
    }
    .filter-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      padding: 4px;
      background: #f7f9fb;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .filter-button {
      flex: 1;
      min-height: 36px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .filter-button:hover {
      color: var(--text);
      background: #fff;
    }

    .filter-button.active {
      color: var(--accent-hover);
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px rgba(106, 169, 255, 0.2);
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0 0 0 26px;
      display: grid;
      gap: 18px;
    }

    .date-group {
      position: relative;
      margin-top: 8px;
      padding: 8px 12px;
      background: #eef4fb;
      color: #3f5368;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .date-group::before {
      content: "";
      position: absolute;
      left: -23px;
      top: 50%;
      width: 10px;
      height: 10px;
      background: var(--accent);
      border: 3px solid var(--surface);
      border-radius: 50%;
      box-shadow: 0 0 0 3px var(--accent-soft);
      transform: translateY(-50%);
    }

    .task-item {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 16px;
      min-height: 62px;
      padding: 16px 18px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--item-shadow);
      animation: taskIn 0.24s ease both;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .task-item::before {
      content: "";
      position: absolute;
      left: -18px;
      top: -18px;
      bottom: -18px;
      width: 2px;
      background: #d9e3ee;
      border-radius: 999px;
    }

    .task-item.removing {
      opacity: 0;
      transform: translateX(14px);
    }

    .toggle {
      appearance: none;
      width: 22px;
      height: 22px;
      margin: 0;
      border: 2px solid #c8d3df;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .toggle::after {
      content: "";
      width: 6px;
      height: 10px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      opacity: 0;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    .toggle:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .toggle:checked::after {
      opacity: 1;
    }

    .toggle:focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px rgba(106, 169, 255, 0.18);
    }

    .todo-text {
      overflow-wrap: anywhere;
      line-height: 1.45;
    }

    .todo-content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .todo-detail {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .todo-time {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .deadline-pill {
      width: fit-content;
      padding: 3px 8px;
      border-radius: 999px;
      background: #eef2f6;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
    }

    .deadline-pill.today,
    .deadline-pill.soon {
      background: #fff6da;
      color: #946400;
    }

    .deadline-pill.overdue {
      background: #fff1f1;
      color: var(--danger-hover);
    }

    .task-item.soon {
      border-color: #f1d990;
    }

    .task-item.overdue {
      border-color: #ffc7c7;
    }

    .task-item.completed .todo-text {
      color: var(--muted);
      text-decoration: line-through;
    }

    .delete-button {
      width: 34px;
      height: 34px;
      background: #fff1f1;
      color: var(--danger);
      border: 1px solid #ffd2d2;
      padding: 0;
      font-size: 18px;
      line-height: 1;
      display: grid;
      place-items: center;
    }

    .delete-button:hover {
      color: #fff;
      border-color: var(--danger-hover);
      background: var(--danger-hover);
      transform: translateY(-1px);
    }

    .empty {
      margin: 20px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 15px;
    }

    .stats {
      margin: 22px 0 0;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    @keyframes taskIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 24px 14px;
        place-items: start stretch;
      }

      main {
        padding: 22px;
        border-radius: 16px;
      }

      header {
        align-items: start;
        gap: 12px;
      }

      h1 {
        margin-bottom: 6px;
        font-size: 25px;
      }

      .language-switch {
        gap: 6px;
      }

      .language-option {
        width: 34px;
        height: 34px;
        font-size: 12px;
      }

      form {
        grid-template-columns: 1fr;
      }

      .add-button,
      .due-date-input {
        width: 100%;
      }

      .focus-item {
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .license-form {
        grid-template-columns: 1fr;
      }

      .license-button {
        width: 100%;
      }
      ul {
        padding-left: 22px;
        gap: 16px;
      }

      .task-item {
        grid-template-columns: auto 1fr auto;
        gap: 12px;
        padding: 14px;
      }

      .todo-content {
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .todo-time {
        justify-self: start;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="title-area">
        <h1 data-i18n="title"></h1>
        <span class="count" id="todoCount"></span>
      </div>
      <div class="language-switch" id="languageSwitch" role="group">
        <button class="language-option" type="button" data-lang="zh" data-i18n="languageZhShort"></button>
        <button class="language-option" type="button" data-lang="en" data-i18n="languageEnShort"></button>
      </div>
    </header>

    <form id="todoForm" autocomplete="off">
      <input id="todoInput" type="text" data-i18n-placeholder="inputPlaceholder" data-i18n-aria-label="inputLabel" maxlength="120">
      <input id="dueDateInput" class="due-date-input pro-only" type="date" data-i18n-aria-label="dueDateLabel" hidden>
      <button class="add-button" type="submit" data-i18n="addButton"></button>
    </form>

    <div class="upgrade-section" id="upgradeSection">
      <p class="upgrade-title" data-i18n="upgradeTitle"></p>
      <p class="upgrade-copy" data-i18n="upgradeDescription"></p>
      <ul class="upgrade-benefits">
        <li data-i18n="upgradeBenefitDue"></li>
        <li data-i18n="upgradeBenefitToday"></li>
        <li data-i18n="upgradeBenefitOverdue"></li>
      </ul>
      <a id="upgradeButton" href="https://lewtewstory.lemonsqueezy.com/checkout/buy/b0131956-6576-4487-bad4-d05112994006?embed=1" class="upgrade-button lemonsqueezy-button" data-i18n="upgradeButton"></a>
            <form class="license-form" id="licenseForm" autocomplete="off">
        <input id="licenseKeyInput" class="license-input" type="text" data-i18n-placeholder="licensePlaceholder" data-i18n-aria-label="licenseLabel">
        <button class="license-button" type="submit" data-i18n="licenseVerifyButton"></button>
      </form>
      <p class="license-status" id="licenseStatus"></p><span class="pro-status" id="proStatus" data-i18n="proUnlocked" hidden></span>
    </div>

    <section class="focus-section pro-only" id="focusSection" hidden>
      <h2 class="focus-title" data-i18n="todayFocusTitle"></h2>
      <div class="focus-list" id="focusList"></div>
    </section>

    <div class="filter-controls" data-i18n-aria-label="filterLabel">
      <button class="filter-button active" type="button" data-filter="all" data-i18n="filterAll" aria-pressed="true"></button>
      <button class="filter-button" type="button" data-filter="active" data-i18n="filterActive" aria-pressed="false"></button>
      <button class="filter-button" type="button" data-filter="completed" data-i18n="filterCompleted" aria-pressed="false"></button>
    </div>

    <ul id="todoList" data-i18n-aria-label="todoListLabel"></ul>
    <p class="empty" id="emptyState"></p>
    <p class="stats" id="todoStats"></p>
  </main>

  <script>
    const STORAGE_KEY = "minimal_todos";
    const LANGUAGE_KEY = "minimal_todos_language";
    const LICENSE_STORAGE_KEY = "minimal_todos_license";
    const i18n = {
      zh: {
        title: "待办事项",

        activeCount: "{count} 项待办",

        languageEnShort: "En",
        languageZhLabel: "切换到中文",
        languageEnLabel: "切换到英文",
        today: "今天",
        yesterday: "昨天",
        dateLocale: "zh-CN",
        timeLocale: "zh-CN"
      },
      en: {
        title: "Todo List",
        documentTitle: "Todo List",
        inputPlaceholder: "Add a new task",
        inputLabel: "Add a new task",
        addButton: "Add",
        upgradeButton: "Upgrade to Pro",
        upgradeTitle: "Pro: due dates and countdowns",
        upgradeDescription: "Add deadlines to tasks, surface today focus, and flag overdue work automatically.",
        upgradeBenefitDue: "Set due dates with day countdowns",
        upgradeBenefitToday: "Auto-build today focus list",
        upgradeBenefitOverdue: "Highlight overdue tasks",
        proUnlocked: "Pro unlocked",
        licensePlaceholder: "Enter the license from your receipt",
        licenseLabel: "License key",
        licenseVerifyButton: "Verify license",
        licenseRequired: "Enter your license key.",
        licenseChecking: "Verifying license...",
        licenseSuccess: "License verified. Pro is unlocked.",
        licenseInvalid: "License is invalid or inactive.",
        licenseNetworkError: "License verification is unavailable. Deploy to Vercel and try again.",
        dueDateLabel: "Due date",
        todayFocusTitle: "Today focus",
        noTodayFocus: "No urgent or overdue tasks today",
        filterLabel: "Filter tasks",
        filterAll: "All",
        filterActive: "Active",
        filterCompleted: "Completed",
        todoListLabel: "Todo list",
        emptyState: "What would you like to do today? ✨",
        emptyFilter: "No tasks in this filter yet",
        activeCount: "{count} active",
        stats: "Completed {completed} / {total} tasks",
        markComplete: "Mark complete",
        deleteTask: "Delete {text}",
        paymentSuccess: "Payment successful! Check your email for the license key, then verify it here.",
        deadlineToday: "Due today",
        deadlineTomorrow: "Due tomorrow",
        deadlineInDays: "Due in {days} days",
        deadlineOverdueOne: "Overdue by 1 day",
        deadlineOverdueDays: "Overdue by {days} days",
        deadlineDate: "Due {date}",
        languageSwitchLabel: "Switch language",
        languageZhShort: "中",
        languageEnShort: "En",
        languageZhLabel: "Switch to Chinese",
        languageEnLabel: "Switch to English",
        today: "Today",
        yesterday: "Yesterday",
        dateLocale: "en-US",
        timeLocale: "en-US"
      }
    };
    const form = document.getElementById("todoForm");
    const input = document.getElementById("todoInput");
    const dueDateInput = document.getElementById("dueDateInput");
    const list = document.getElementById("todoList");
    const count = document.getElementById("todoCount");
    const emptyState = document.getElementById("emptyState");
    const stats = document.getElementById("todoStats");
    const upgradeSection = document.getElementById("upgradeSection");
    const upgradeButton = document.getElementById("upgradeButton");
    const licenseForm = document.getElementById("licenseForm");
    const licenseKeyInput = document.getElementById("licenseKeyInput");
    const licenseStatus = document.getElementById("licenseStatus");
    const proStatus = document.getElementById("proStatus");
    const focusSection = document.getElementById("focusSection");
    const focusList = document.getElementById("focusList");
    const languageSwitch = document.getElementById("languageSwitch");
    const languageButtons = document.querySelectorAll(".language-option");
    const addButton = form.querySelector(".add-button");
    const filterButtons = document.querySelectorAll(".filter-button");

    let currentLanguage = getInitialLanguage();
    let isProUnlocked = false;
    let savedLicense = loadSavedLicense();
    let todos = loadTodos();
    let currentFilter = "all";
    saveTodos();

    function getInitialLanguage() {
      const savedLanguage = localStorage.getItem(LANGUAGE_KEY);

      if (i18n[savedLanguage]) {
        return savedLanguage;
      }

      return navigator.language && navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en";
    }

    function t(key, values = {}) {
      let text = i18n[currentLanguage][key] || i18n.zh[key] || key;

      Object.entries(values).forEach(([name, value]) => {
        text = text.replace(`{${name}}`, value);
      });

      return text;
    }

    function loadSavedLicense() {
      try {
        return JSON.parse(localStorage.getItem(LICENSE_STORAGE_KEY)) || null;
      } catch {
        return null;
      }
    }

    function saveLicense(license) {
      savedLicense = license;
      localStorage.setItem(LICENSE_STORAGE_KEY, JSON.stringify(license));
    }

    function setLicenseStatus(message, type = "") {
      licenseStatus.textContent = message;
      licenseStatus.className = `license-status ${type}`.trim();
    }

    async function activateLicense(licenseKey) {
      const response = await fetch("/api/license/activate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ licenseKey })
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok || !data.ok) {
        throw new Error(data.error || t("licenseInvalid"));
      }

      saveLicense({
        licenseKey: data.licenseKey || licenseKey,
        instanceId: data.instanceId
      });
      unlockPro();
      setLicenseStatus(t("licenseSuccess"), "success");
    }

    async function validateSavedLicense() {
      if (!savedLicense || !savedLicense.licenseKey) {
        return;
      }

      try {
        const response = await fetch("/api/license/validate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(savedLicense)
        });
        const data = await response.json().catch(() => ({}));

        if (response.ok && data.ok) {
          unlockPro();
          setLicenseStatus(t("licenseSuccess"), "success");
          return;
        }

        isProUnlocked = false;
        renderProState();
      } catch {
        isProUnlocked = false;
        renderProState();
      }
    }
    function setupLemonSqueezy() {
      if (!window.LemonSqueezy) {
        window.addEventListener("load", setupLemonSqueezy, { once: true });
        return;
      }

      if (setupLemonSqueezy.ready) {
        return;
      }

      setupLemonSqueezy.ready = true;
      window.LemonSqueezy.Setup({
        eventHandler(event) {
          if (event.event === "Checkout.Success") {
            alert(t("paymentSuccess"));
          }
        }
      });

      if (typeof window.createLemonSqueezy === "function") {
        window.createLemonSqueezy();
      }
    }

    function unlockPro() {
      isProUnlocked = true;
      renderProState();
      renderTodos();
    }

    function renderI18n() {
      document.documentElement.lang = currentLanguage === "zh" ? "zh-CN" : "en";
      document.title = t("documentTitle");
      languageSwitch.setAttribute("aria-label", t("languageSwitchLabel"));

      document.querySelectorAll("[data-i18n]").forEach((element) => {
        element.textContent = t(element.dataset.i18n);
      });

      document.querySelectorAll("[data-i18n-placeholder]").forEach((element) => {
        element.placeholder = t(element.dataset.i18nPlaceholder);
      });

      document.querySelectorAll("[data-i18n-aria-label]").forEach((element) => {
        element.setAttribute("aria-label", t(element.dataset.i18nAriaLabel));
      });

      languageButtons.forEach((button) => {
        const isActive = button.dataset.lang === currentLanguage;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
        button.setAttribute("aria-label", t(button.dataset.lang === "zh" ? "languageZhLabel" : "languageEnLabel"));
      });

      renderProState();
    }

    function renderProState() {
      upgradeSection.classList.toggle("unlocked", isProUnlocked);
      upgradeButton.hidden = isProUnlocked;
      licenseForm.hidden = isProUnlocked;
      proStatus.hidden = !isProUnlocked;
      dueDateInput.hidden = !isProUnlocked;
      dueDateInput.disabled = !isProUnlocked;
      focusSection.hidden = !isProUnlocked;

      if (!isProUnlocked) {
        dueDateInput.value = "";
      }
    }

    function formatDateTime(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      const hours = String(date.getHours()).padStart(2, "0");
      const minutes = String(date.getMinutes()).padStart(2, "0");

      return `${year}-${month}-${day} ${hours}:${minutes}`;
    }

    function parseCreatedAt(createdAt) {
      const [datePart, timePart = "00:00"] = createdAt.split(" ");
      const [year, month, day] = datePart.split("-").map(Number);
      const [hours, minutes] = timePart.split(":").map(Number);

      return new Date(year, month - 1, day, hours, minutes);
    }

    function getDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function getGroupTitle(dateKey) {
      const date = parseCreatedAt(`${dateKey} 00:00`);
      const today = new Date();
      const yesterday = new Date();
      yesterday.setDate(today.getDate() - 1);

      if (dateKey === getDateKey(today)) {
        return t("today");
      }

      if (dateKey === getDateKey(yesterday)) {
        return t("yesterday");
      }

      const month = date.toLocaleString(t("dateLocale"), { month: "short" });
      const weekday = date.toLocaleString(t("dateLocale"), { weekday: "short" });

      if (currentLanguage === "zh") {
        return `${month}${date.getDate()}日，${weekday}`;
      }

      return `${month} ${date.getDate()}, ${weekday}`;
    }

    function getTaskTime(createdAt) {
      return parseCreatedAt(createdAt).toLocaleTimeString(t("timeLocale"), {
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function parseDueDate(dueDate) {
      const [year, month, day] = dueDate.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function getDueDayDiff(dueDate) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return Math.round((parseDueDate(dueDate) - today) / 86400000);
    }

    function formatDueDate(dueDate) {
      return parseDueDate(dueDate).toLocaleDateString(t("dateLocale"), {
        month: "short",
        day: "numeric"
      });
    }

    function getDeadlineInfo(todo) {
      if (!isProUnlocked || !todo.dueDate) {
        return null;
      }

      const days = getDueDayDiff(todo.dueDate);

      if (days < 0) {
        const overdueDays = Math.abs(days);
        return {
          status: "overdue",
          text: overdueDays === 1 ? t("deadlineOverdueOne") : t("deadlineOverdueDays", { days: overdueDays })
        };
      }

      if (days === 0) {
        return { status: "today", text: t("deadlineToday") };
      }

      if (days === 1) {
        return { status: "soon", text: t("deadlineTomorrow") };
      }

      if (days <= 3) {
        return { status: "soon", text: t("deadlineInDays", { days }) };
      }

      return { status: "normal", text: t("deadlineDate", { date: formatDueDate(todo.dueDate) }) };
    }

    function loadTodos() {
      try {
        const savedTodos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        return savedTodos.map((todo) => ({
          ...todo,
          createdAt: todo.createdAt || formatDateTime(new Date()),
          dueDate: todo.dueDate || ""
        }));
      } catch {
        return [];
      }
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function renderTodos() {
      list.innerHTML = "";
      updateFilterButtons();

      const visibleTodos = todos.filter((todo) => {
        if (currentFilter === "active") {
          return !todo.completed;
        }

        if (currentFilter === "completed") {
          return todo.completed;
        }

        return true;
      });

      const groupedTodos = visibleTodos.reduce((groups, todo) => {
          const dateKey = todo.createdAt.slice(0, 10);

          if (!groups.has(dateKey)) {
            groups.set(dateKey, []);
          }

          groups.get(dateKey).push(todo);
          return groups;
        }, new Map());

      Array.from(groupedTodos.keys())
        .sort((a, b) => parseCreatedAt(`${b} 00:00`) - parseCreatedAt(`${a} 00:00`))
        .forEach((dateKey) => {
        const groupTodos = groupedTodos
          .get(dateKey)
          .sort((a, b) => parseCreatedAt(a.createdAt) - parseCreatedAt(b.createdAt));
        const groupTitle = document.createElement("li");
        groupTitle.className = "date-group";
        groupTitle.textContent = getGroupTitle(dateKey);
        list.appendChild(groupTitle);

        groupTodos.forEach((todo) => {
        const item = document.createElement("li");
        const deadline = getDeadlineInfo(todo);
        const deadlineClass = deadline && !todo.completed && deadline.status !== "normal" ? ` ${deadline.status}` : "";
        item.className = `task-item${todo.completed ? " completed" : ""}${deadlineClass}`;

        const checkbox = document.createElement("input");
        checkbox.className = "toggle";
        checkbox.type = "checkbox";
        checkbox.checked = todo.completed;
        checkbox.setAttribute("aria-label", t("markComplete"));
        checkbox.addEventListener("change", () => toggleTodo(todo.id));

        const text = document.createElement("span");
        text.className = "todo-text";
        text.textContent = todo.text;

        const time = document.createElement("span");
        time.className = "todo-time";
        time.textContent = getTaskTime(todo.createdAt);

        const detail = document.createElement("span");
        detail.className = "todo-detail";
        detail.appendChild(text);

        if (deadline) {
          const deadlineBadge = document.createElement("span");
          deadlineBadge.className = `deadline-pill ${deadline.status}`;
          deadlineBadge.textContent = deadline.text;
          detail.appendChild(deadlineBadge);
        }

        const content = document.createElement("span");
        content.className = "todo-content";
        content.append(detail, time);

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.textContent = "✕";
        deleteButton.setAttribute("aria-label", t("deleteTask", { text: todo.text }));
        deleteButton.addEventListener("click", () => {
          item.classList.add("removing");
          setTimeout(() => deleteTodo(todo.id), 200);
        });

        item.append(checkbox, content, deleteButton);
        list.appendChild(item);
        });
      });

      const activeCount = todos.filter((todo) => !todo.completed).length;
      const completedCount = todos.length - activeCount;
      count.textContent = t("activeCount", { count: activeCount });
      stats.textContent = t("stats", { completed: completedCount, total: todos.length });
      emptyState.textContent = todos.length === 0 ? t("emptyState") : t("emptyFilter");
      emptyState.hidden = visibleTodos.length > 0;
      renderTodayFocus();
    }

    function renderTodayFocus() {
      focusList.innerHTML = "";

      if (!isProUnlocked) {
        return;
      }

      const focusTodos = todos
        .filter((todo) => !todo.completed && todo.dueDate && getDueDayDiff(todo.dueDate) <= 0)
        .sort((a, b) => getDueDayDiff(a.dueDate) - getDueDayDiff(b.dueDate));

      if (focusTodos.length === 0) {
        const empty = document.createElement("p");
        empty.className = "focus-empty";
        empty.textContent = t("noTodayFocus");
        focusList.appendChild(empty);
        return;
      }

      focusTodos.forEach((todo) => {
        const deadline = getDeadlineInfo(todo);
        const item = document.createElement("div");
        item.className = "focus-item";

        const text = document.createElement("span");
        text.textContent = todo.text;

        const badge = document.createElement("span");
        badge.className = `deadline-pill ${deadline.status}`;
        badge.textContent = deadline.text;

        item.append(text, badge);
        focusList.appendChild(item);
      });
    }

    function updateFilterButtons() {
      filterButtons.forEach((button) => {
        const isActive = button.dataset.filter === currentFilter;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });
    }

    function updateAddButton() {
      addButton.disabled = input.value.trim().length === 0;
    }

    function addTodo(text) {
      todos.unshift({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        text,
        completed: false,
        createdAt: formatDateTime(new Date()),
        dueDate: isProUnlocked ? dueDateInput.value : ""
      });
      currentFilter = "all";
      saveTodos();
      renderTodos();
    }

    function toggleTodo(id) {
      todos = todos.map((todo) => (
        todo.id === id ? { ...todo, completed: !todo.completed } : todo
      ));
      saveTodos();
      renderTodos();
    }

    function deleteTodo(id) {
      todos = todos.filter((todo) => todo.id !== id);
      saveTodos();
      renderTodos();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();

      if (!text) {
        input.focus();
        return;
      }

      addTodo(text);
      input.value = "";
      dueDateInput.value = "";
      updateAddButton();
      input.focus();
    });

    input.addEventListener("input", updateAddButton);

    filterButtons.forEach((button) => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        renderTodos();
      });
    });

    languageButtons.forEach((button) => {
      button.addEventListener("click", () => {
        currentLanguage = button.dataset.lang;
        localStorage.setItem(LANGUAGE_KEY, currentLanguage);
        renderI18n();
        renderTodos();
      });
    });

    licenseForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const licenseKey = licenseKeyInput.value.trim();

      if (!licenseKey) {
        setLicenseStatus(t("licenseRequired"), "error");
        licenseKeyInput.focus();
        return;
      }

      setLicenseStatus(t("licenseChecking"));

      try {
        await activateLicense(licenseKey);
      } catch (error) {
        setLicenseStatus(error.message || t("licenseNetworkError"), "error");
      }
    });

    renderI18n();
    setupLemonSqueezy();
    updateAddButton();
    renderTodos();
    validateSavedLicense();
  </script>
</body>
</html>
